<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganamos</title>

<!-- META PIXEL -->

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 15%, #471075 0%, #210039 35%, #0e0019 72%);
}

/* CONTENEDOR */

.container{
  width:min(430px,94vw);
  min-height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:18px 10px 25px;
}

/* LOGO */

.logo{
  display:block;
  width:min(350px,88vw);
  height:auto;
  margin:-20px auto -55px;
  position:relative;
  z-index:2;
}

/* PERRO */

.dog{
  display:block;
  width:min(205px,52vw);
  height:auto;
  margin:0 auto 0;
  position:relative;
  z-index:1;

  filter:
    drop-shadow(0 0 12px rgba(173,55,255,.40))
    drop-shadow(0 8px 20px rgba(0,0,0,.45));
}

/* TEXTO PRINCIPAL */

.title{
  margin:5px 0 2px;
  font-size:30px;
  font-weight:900;
  line-height:1.05;
  letter-spacing:-.6px;
}

.title span{
  display:block;
  margin-top:5px;
  color:#c05cff;
}

.subtitle{
  margin:12px 0 18px;
  font-size:16px;
  line-height:1.35;
  color:#eee;
}

/* BOTÓN */

.whatsapp-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:18px 15px;

  text-decoration:none;
  color:white;

  font-size:21px;
  font-weight:900;

  border-radius:50px;

  background:
    linear-gradient(180deg,#25e766,#08b941);

  box-shadow:
    0 0 18px rgba(37,231,102,.65),
    0 8px 25px rgba(0,0,0,.35);

  position:relative;

  animation:pulse 1.6s ease-in-out infinite;

  -webkit-tap-highlight-color:transparent;
}

.whatsapp-icon{
  width:33px;
  height:33px;
  border:3px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.arrow{
  position:absolute;
  right:20px;
  font-size:30px;
  line-height:1;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
    box-shadow:
      0 0 15px rgba(37,231,102,.50),
      0 8px 25px rgba(0,0,0,.35);
  }

  50%{
    transform:scale(1.025);
    box-shadow:
      0 0 28px rgba(37,231,102,.90),
      0 8px 28px rgba(0,0,0,.40);
  }
}

/* TEXTO DEBAJO */

.help{
  margin:14px 0 18px;
  font-size:14px;
  color:#ddd;
}

.online{
  display:inline-block;
  width:9px;
  height:9px;
  background:#25d366;
  border-radius:50%;
  margin-right:6px;
  box-shadow:0 0 8px #25d366;
}

/* BENEFICIOS */

.features{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-top:5px;

  padding:17px 5px;

  border-top:1px solid rgba(190,80,255,.25);
  border-bottom:1px solid rgba(190,80,255,.25);
}

.feature{
  padding:0 7px;
  font-size:12px;
  line-height:1.25;
  color:#eee;
}

.feature:not(:last-child){
  border-right:1px solid rgba(190,80,255,.25);
}

.feature-icon{
  display:block;
  font-size:24px;
  margin-bottom:7px;
}

/* FINAL */

.footer{
  margin-top:17px;
  font-size:11px;
  letter-spacing:2px;
  color:#b979df;
}

.responsible{
  margin-top:10px;
  font-size:11px;
  color:#aaa;
}

@media(max-height:700px){

  .container{
    justify-content:flex-start;
    padding-top:5px;
  }

  .logo{
    width:300px;
    margin-top:-30px;
    margin-bottom:-60px;
  }

  .dog{
    width:165px;
  }

  .title{
    font-size:26px;
  }

  .subtitle{
    margin:8px 0 13px;
  }

  .whatsapp-btn{
    padding:15px 12px;
    font-size:19px;
  }

}

</style>
</head>

<body>

<div class="container">

  <!-- TU LOGO GANAMOS -->
  <img
    src="https://raw.githubusercontent.com/lamikitsi/landing-ganamos/main/assets/logo.png"
    class="logo"
    alt="Ganamos"
  >

  <!-- TU PERRO -->
  <img
    src="https://raw.githubusercontent.com/lamikitsi/landing-ganamos/main/assets/dog.png"
    class="dog"
    alt="Ganamos"
  >

  <div class="title">
    ¿QUERÉS EMPEZAR?
    <span>HABLÁ CON NOSOTROS</span>
  </div>

  <div class="subtitle">
    Atención inmediata por WhatsApp
  </div>

  <!-- WHATSAPP + PIXEL + CAPI -->
  <a
    class="whatsapp-btn"
    href="https://www.linkify.com.ar/api/soporte?id=gxsbti"
    onclick="const eid='lead_'+Date.now()+'_'+Math.random().toString(36).slice(2); fbq('track','Lead',{}, {eventID:eid}); navigator.sendBeacon('/api/capi?event_id='+encodeURIComponent(eid));"
  >

    <span class="whatsapp-icon">☎</span>

    HABLAR POR WHATSAPP

    <span class="arrow">›</span>

  </a>

  <div class="help">
    <span class="online"></span>
    Tocá el botón para iniciar la conversación
  </div>

  <div class="features">

    <div class="feature">
      <span class="feature-icon">⚡</span>
      RESPUESTA<br>RÁPIDA
    </div>

    <div class="feature">
      <span class="feature-icon">🛡️</span>
      ATENCIÓN<br>SEGURA
    </div>

    <div class="feature">
      <span class="feature-icon">💬</span>
      ATENCIÓN POR<br>WHATSAPP
    </div>

  </div>

  <div class="footer">
    GANAMOS • TU LUGAR DE SIEMPRE
  </div>

  <div class="responsible">
    +18 · Jugá responsablemente
  </div>

</div>

</body>
</html>
